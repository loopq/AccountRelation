<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>密码生成器 · 账号图谱</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="密码生成器">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<style>
  /* ---------- tokens (与主站账号图谱保持一致) ---------- */
  :root {
    --bg: #0e0f13; --panel: #171a21; --panel-2: #1f232c; --field: #0f1116;
    --line: #272b36; --line-strong: #3a3f4d;
    --ink: #e9e7e1; --ink-2: #b6b9c3; --ink-dim: #7f8493;
    --accent: #d4a857; --accent-ink: #1a1507; --accent-soft: rgba(212,168,87,.14);
    --accent-2: #6a9cbd;
    --danger: #d4675f; --danger-soft: rgba(212,103,95,.14);
    --ok: #72b26c; --ok-soft: rgba(114,178,108,.14);
    --cat-email: #5b8fb0; --cat-apple: #d4a857; --cat-ai: #9b7fc4;
    --shadow-1: 0 1px 2px rgba(0,0,0,.35);
    --shadow-2: 0 18px 44px -16px rgba(0,0,0,.68);
    --r-s: 8px; --r-m: 12px; --r-l: 20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f4f4f0; --panel: #ffffff; --panel-2: #eeeee8; --field: #fcfcfa;
    --line: #e1e1d9; --line-strong: #c9c9bf;
    --ink: #1b1d22; --ink-2: #4a4f5b; --ink-dim: #7a7f8c;
    --accent: #b07d2e; --accent-ink: #1a1507; --accent-soft: rgba(176,125,46,.13);
    --accent-2: #3d7196;
    --danger: #b0433b; --danger-soft: rgba(176,67,59,.1);
    --ok: #4a8a45; --ok-soft: rgba(74,138,69,.12);
    --cat-email: #3d7196; --cat-apple: #b07d2e; --cat-ai: #7a5fa4;
    --shadow-1: 0 1px 3px rgba(30,30,20,.08);
    --shadow-2: 0 18px 44px -16px rgba(30,30,20,.18);
    color-scheme: light;
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(680px 440px at 16% 10%, var(--accent-soft), transparent 64%),
      radial-gradient(560px 440px at 88% 90%, color-mix(in srgb, var(--cat-ai), transparent 86%), transparent 64%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      max(20px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .sprite { display: none; }
  .mono { font-family: var(--mono); }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); }
  .hidden { display: none !important; }

  /* ---------- card ---------- */
  .stage { width: 100%; display: flex; justify-content: center; }
  .gen-card {
    width: 100%;
    max-width: 472px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    padding: 24px 24px 20px;
    box-shadow: var(--shadow-2), inset 0 1px 0 color-mix(in srgb, var(--ink), transparent 95%);
  }

  /* ---------- card top bar ---------- */
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand .mark { width: 24px; height: 24px; display: block; flex: none; }
  .brand h1 { font-size: 15px; font-weight: 650; letter-spacing: .01em; color: var(--ink); white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .top-btn {
    height: 34px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--panel-2);
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .top-btn:hover { background: color-mix(in srgb, var(--panel-2), var(--ink) 6%); color: var(--ink); border-color: var(--line-strong); }
  .top-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent), transparent 55%);
  }
  .top-btn .ic { width: 15px; height: 15px; }
  .count-pill {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 650;
    line-height: 1;
    min-width: 18px;
    padding: 3px 5px;
    border-radius: 999px;
    text-align: center;
    background: color-mix(in srgb, var(--accent), transparent 82%);
    color: var(--accent);
  }
  .theme-btn {
    width: 34px; height: 34px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ink-dim);
    border: 1px solid transparent; border-radius: var(--r-s);
    cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .theme-btn:hover { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
  .theme-btn .ic { width: 17px; height: 17px; }
  [data-theme="light"] .ic-sun { display: none; }
  :root:not([data-theme="light"]) .ic-moon { display: none; }

  /* ---------- section layout ---------- */
  .sec + .sec {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 11px;
  }
  .sec-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--ink-dim);
  }

  /* ---------- segmented mode tabs ---------- */
  .seg-tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
    padding: 4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
  }
  .seg-tab {
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    min-height: 38px;
    padding: 6px 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s, box-shadow .15s;
  }
  .seg-tab .ic { width: 15px; height: 15px; color: var(--ink-dim); transition: color .15s; }
  .seg-tab:hover:not(.active) { color: var(--ink); }
  .seg-tab:hover:not(.active) .ic { color: var(--ink-2); }
  .seg-tab.active {
    background: var(--panel);
    color: var(--ink);
    font-weight: 600;
    border-color: color-mix(in srgb, var(--line), transparent 20%);
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.05);
  }
  [data-theme="light"] .seg-tab.active {
    border-color: rgba(30,30,20,.06);
    box-shadow: 0 1px 3px rgba(30,30,20,.09), 0 1px 1px rgba(30,30,20,.04);
  }
  .seg-tab.active .ic { color: var(--accent); }

  /* ---------- slider + numeric box ---------- */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 44px;
  }
  .ctrl-lbl {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
    flex: none;
  }
  .range-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  input[type="range"] {
    --p: 8.7%;
    --track-rest: color-mix(in srgb, var(--line-strong), var(--panel-2) 30%);
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 28px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--p), var(--track-rest) var(--p), var(--track-rest) 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -7px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--accent);
    box-shadow: 0 1.5px 5px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.04);
    transition: transform .14s cubic-bezier(.32,.72,0,1), box-shadow .14s;
  }
  input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.08);
    box-shadow: 0 2px 7px rgba(0,0,0,.24), 0 0 0 4px var(--accent-soft);
  }
  input[type="range"]:active::-webkit-slider-thumb {
    transform: scale(1.13);
    box-shadow: 0 2px 8px rgba(0,0,0,.26), 0 0 0 6px var(--accent-soft);
  }
  input[type="range"]::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: var(--track-rest);
  }
  input[type="range"]::-moz-range-progress {
    height: 6px;
    border-radius: 999px;
    background: var(--accent);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid var(--accent);
    box-shadow: 0 1.5px 5px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.04);
    transition: transform .14s cubic-bezier(.32,.72,0,1), box-shadow .14s;
  }
  .num-box {
    width: 62px;
    height: 38px;
    flex: none;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
    padding: 0 6px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.04);
    -moz-appearance: textfield;
    transition: border-color .15s, box-shadow .15s;
  }
  .num-box::-webkit-inner-spin-button,
  .num-box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .num-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- toggle switches (v2 crisp pill switch) ---------- */
  .opt-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 24px;
    margin-top: 10px;
  }
  .switch-item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .switch-text {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
  }
  .switch-item input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 46px;
    height: 28px;
    right: 0;
    margin: 0;
    cursor: pointer;
  }
  .switch-track {
    width: 44px;
    height: 24px;
    border-radius: 999px;
    background: #2b303c;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.28);
    position: relative;
    flex: none;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  [data-theme="light"] .switch-track {
    background: #dcdcd3;
    border-color: rgba(30,30,20,.07);
    box-shadow: inset 0 1px 2px rgba(30,30,20,.08);
  }
  .switch-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 1.5px 3.5px rgba(0,0,0,.22), 0 0.5px 1px rgba(0,0,0,.1);
    transition: transform .22s cubic-bezier(.32,.72,0,1), width .16s ease, box-shadow .2s ease;
  }
  .switch-item:hover .switch-track::after {
    box-shadow: 0 2px 5px rgba(0,0,0,.26), 0 0.5px 1.5px rgba(0,0,0,.12);
  }
  .switch-item:active .switch-track::after {
    width: 21px;
  }
  .switch-item input:checked + .switch-track {
    background: var(--accent);
    border-color: transparent;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.18);
  }
  .switch-item:hover input:checked + .switch-track {
    background: color-mix(in srgb, var(--accent), #fff 7%);
  }
  .switch-item input:checked + .switch-track::after {
    transform: translateX(20px);
    background: #ffffff;
  }
  .switch-item:active input:checked + .switch-track::after {
    transform: translateX(17px);
    width: 21px;
  }
  .switch-item input:focus-visible + .switch-track {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- memorable separator pills ---------- */
  .sep-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  .sep-pills {
    display: inline-flex;
    gap: 3px;
    padding: 3px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
  }
  .sep-pill {
    font: 600 12.5px var(--mono);
    min-width: 34px;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sep-pill:hover:not(.active) { color: var(--ink); }
  .sep-pill.active {
    background: var(--panel);
    color: var(--accent);
    box-shadow: var(--shadow-1);
  }

  /* ---------- strength badge ---------- */
  .strength {
    --sc: var(--ok);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--sc);
    background: color-mix(in srgb, var(--sc), transparent 88%);
    border: 1px solid color-mix(in srgb, var(--sc), transparent 62%);
    border-radius: 999px;
    padding: 3px 9px;
    line-height: 1.2;
  }
  .strength .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sc);
  }
  .strength[data-level="weak"] { --sc: var(--danger); }
  .strength[data-level="fair"] { --sc: var(--accent); }
  .strength[data-level="strong"] { --sc: var(--accent-2); }
  .strength[data-level="very-strong"] { --sc: var(--ok); }

  /* ---------- generated password display ---------- */
  .pw-box {
    width: 100%;
    min-height: 82px;
    padding: 18px 16px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: border-color .16s, box-shadow .16s, background .16s, transform .1s;
  }
  [data-theme="light"] .pw-box {
    box-shadow: inset 0 1px 2px rgba(30,30,20,.04);
  }
  .pw-box:hover {
    border-color: color-mix(in srgb, var(--accent), var(--line-strong) 45%);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .pw-box:active { transform: scale(.995); }
  .pw-text {
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 550;
    letter-spacing: .045em;
    line-height: 1.55;
    text-align: center;
    overflow-wrap: anywhere;
    word-break: break-word;
    user-select: all;
    transition: opacity .14s;
  }
  .pw-text.len-md { font-size: 17.5px; letter-spacing: .035em; }
  .pw-text.len-lg { font-size: 15px; letter-spacing: .025em; line-height: 1.65; }
  .pw-text.pulse { opacity: .35; }
  .ch-alpha { color: var(--ink); }
  .ch-num { color: var(--accent-2); }
  .ch-sym { color: var(--danger); }
  .ch-sep { color: var(--ink-dim); }

  /* ---------- action buttons ---------- */
  .actions-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    min-height: 46px;
    padding: 10px 14px;
    border-radius: var(--r-m);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .1s;
  }
  .btn .ic { width: 16px; height: 16px; }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid transparent;
    box-shadow: 0 2px 10px -3px rgba(212,168,87,.35), inset 0 1px 0 rgba(255,255,255,.24);
  }
  .btn-primary:hover {
    background: color-mix(in srgb, var(--accent), #fff 8%);
    box-shadow: 0 4px 14px -3px rgba(212,168,87,.45), inset 0 1px 0 rgba(255,255,255,.28);
  }
  [data-theme="light"] .btn-primary {
    background: #a57326;
    color: #ffffff;
    box-shadow: 0 2px 8px -2px rgba(165,115,38,.4), inset 0 1px 0 rgba(255,255,255,.18);
  }
  [data-theme="light"] .btn-primary:hover {
    background: #95661f;
    box-shadow: 0 4px 12px -2px rgba(149,102,31,.46), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .btn-primary.copied {
    background: var(--ok);
    color: #0e180d;
    box-shadow: 0 2px 10px -3px rgba(114,178,108,.4);
  }
  [data-theme="light"] .btn-primary.copied {
    background: var(--ok);
    color: #ffffff;
    box-shadow: 0 2px 8px -2px rgba(74,138,69,.38);
  }
  .btn-secondary {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .btn-secondary:hover {
    background: color-mix(in srgb, var(--panel-2), var(--ink) 6%);
    border-color: color-mix(in srgb, var(--accent), var(--line-strong) 40%);
  }
  [data-theme="light"] .btn-secondary {
    background: var(--panel);
    border-color: var(--line-strong);
    box-shadow: 0 1px 2px rgba(30,30,20,.05);
  }
  [data-theme="light"] .btn-secondary:hover {
    background: var(--panel-2);
    border-color: color-mix(in srgb, var(--accent), var(--line-strong) 40%);
  }
  @keyframes spinOnce { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
  .btn-secondary.spinning .ic { animation: spinOnce .28s cubic-bezier(.32,.72,0,1); }

  /* ---------- history view ---------- */
  .hist-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .hist-head-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .hist-back {
    height: 32px;
    padding: 0 9px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--r-s);
    cursor: pointer;
    flex: none;
    transition: background .15s, color .15s, border-color .15s;
  }
  .hist-back:hover { color: var(--ink); border-color: var(--line-strong); }
  .hist-back .ic { width: 14px; height: 14px; }
  .hist-title {
    font-size: 13.5px;
    font-weight: 650;
    color: var(--ink);
    white-space: nowrap;
  }
  .hist-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .hist-clear {
    height: 30px;
    padding: 0 9px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-s);
    cursor: pointer;
    flex: none;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .hist-clear:hover:not(:disabled) {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: color-mix(in srgb, var(--danger), transparent 65%);
  }
  .hist-clear.confirming {
    color: var(--danger);
    background: var(--danger-soft);
    border-color: color-mix(in srgb, var(--danger), transparent 45%);
  }
  .hist-clear:disabled { opacity: .4; cursor: default; }
  .hist-clear .ic { width: 13.5px; height: 13.5px; }

  .hist-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 11px;
    margin-bottom: 10px;
    border-radius: var(--r-s);
    font-size: 12px;
    color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid color-mix(in srgb, var(--danger), transparent 65%);
  }
  .hist-retry {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--danger), transparent 50%);
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    flex: none;
  }
  .hist-retry:hover { background: color-mix(in srgb, var(--danger), transparent 85%); }

  .hist-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: min(420px, 56dvh);
    overflow-y: auto;
    padding-right: 2px;
  }
  .hist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--r-m);
    transition: border-color .15s;
  }
  .hist-item:hover { border-color: var(--line-strong); }
  .hist-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hist-pw {
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 550;
    line-height: 1.45;
    letter-spacing: .02em;
    overflow-wrap: anywhere;
    word-break: break-word;
    user-select: all;
  }
  .hist-time {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-dim);
    line-height: 1.2;
  }
  .hist-copy-btn {
    flex: none;
    min-height: 34px;
    padding: 0 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-s);
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
  }
  .hist-copy-btn:hover {
    border-color: color-mix(in srgb, var(--accent), var(--line-strong) 35%);
    background: color-mix(in srgb, var(--panel-2), var(--ink) 6%);
  }
  .hist-copy-btn:active { transform: translateY(1px); }
  .hist-copy-btn.copied {
    background: var(--ok-soft);
    color: var(--ok);
    border-color: color-mix(in srgb, var(--ok), transparent 50%);
  }
  .hist-copy-btn .ic { width: 13.5px; height: 13.5px; }

  .hist-empty, .hist-state {
    padding: 36px 16px;
    text-align: center;
    color: var(--ink-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .hist-empty .ic { width: 28px; height: 28px; color: var(--ink-dim); opacity: .7; }
  .hist-empty-title { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .hist-empty-sub { font-size: 12px; color: var(--ink-dim); max-width: 280px; }

  /* ---------- card footer ---------- */
  .card-foot {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--ink-dim);
  }
  .card-foot .ic { width: 14px; height: 14px; color: var(--accent); }

  /* ---------- toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    z-index: 300;
    max-width: calc(100% - 32px);
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: var(--shadow-2);
    opacity: 0;
    transform: translate(-50%, 10px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- mobile portrait refinement ---------- */
  @media (max-width: 480px) {
    body {
      padding:
        max(14px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }
    .gen-card {
      padding: 20px 18px 18px;
      border-radius: 18px;
    }
    .seg-tab {
      min-height: 40px;
      font-size: 13px;
      gap: 4px;
      padding: 6px 4px;
    }
    .slider-row { gap: 10px; }
    /* 16px 起步，iOS 聚焦不自动放大 */
    .num-box { width: 58px; font-size: 16px; }
    .pw-box { min-height: 76px; padding: 16px 12px; }
    .pw-text { font-size: 19px; letter-spacing: .035em; }
    .pw-text.len-md { font-size: 16px; }
    .pw-text.len-lg { font-size: 14px; }
    .btn { min-height: 48px; font-size: 14px; padding: 10px 10px; }
    .hist-item { padding: 10px 11px; gap: 8px; }
    .hist-pw { font-size: 13px; }
    .hist-copy-btn { min-height: 36px; padding: 0 10px; }
  }
  @media (max-width: 350px) {
    .seg-tab .ic { display: none; }
    .opt-row { gap: 8px 16px; }
    .top-btn { padding: 0 8px; gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
<script src="/theme.js"></script>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-mark" viewBox="0 0 24 24">
    <path d="M12 7 6.5 17M12 7v10M12 7l5.5 10" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="12" cy="7" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="6.5" cy="17" r="2.6" fill="var(--cat-email)" stroke="none"/>
    <circle cx="12" cy="17" r="2.6" fill="var(--cat-apple)" stroke="none"/>
    <circle cx="17.5" cy="17" r="2.6" fill="var(--cat-ai)" stroke="none"/>
  </symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24">
    <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
  </symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24">
    <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/>
  </symbol>
  <symbol id="i-hash" viewBox="0 0 24 24">
    <path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="m5 12.5 4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/>
    <path d="M21 3v5h-5"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"/>
    <path d="m9 12 2 2 4-4"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.7 6.7 0 0 0 11 11Z"/>
  </symbol>
  <symbol id="i-history" viewBox="0 0 24 24">
    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
    <path d="M3 3v5h5"/>
    <path d="M12 7v5l3 2"/>
  </symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24">
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
  </symbol>
</svg>

<main class="stage">
  <section class="gen-card" aria-label="密码生成器">
    <div class="card-top">
      <div class="brand">
        <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>
        <h1>密码生成器</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="historyBtn" class="top-btn" aria-expanded="false" aria-controls="historyView" title="查看密码历史">
          <svg class="ic" aria-hidden="true"><use href="#i-history"/></svg>
          <span>历史</span>
          <span id="historyCount" class="count-pill hidden">0</span>
        </button>
        <button type="button" id="themeToggle" class="theme-btn" aria-label="切换深浅主题" title="切换深浅主题">
          <svg class="ic ic-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="ic ic-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>

    <div id="generatorView">
    <div class="sec">
      <div class="sec-head">
        <span class="sec-label" id="modeLabel">选择密码类型</span>
      </div>
      <div class="seg-tabs" role="tablist" aria-labelledby="modeLabel">
        <button type="button" class="seg-tab active" role="tab" aria-selected="true" data-mode="random">
          <svg class="ic" aria-hidden="true"><use href="#i-shuffle"/></svg>随机
        </button>
        <button type="button" class="seg-tab" role="tab" aria-selected="false" data-mode="memorable">
          <svg class="ic" aria-hidden="true"><use href="#i-bulb"/></svg>容易记住
        </button>
        <button type="button" class="seg-tab" role="tab" aria-selected="false" data-mode="pin">
          <svg class="ic" aria-hidden="true"><use href="#i-hash"/></svg>PIN
        </button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <span class="sec-label">自定义新密码</span>
      </div>

      <div id="panel-random" data-panel="random">
        <div class="slider-row">
          <label class="ctrl-lbl" for="lenRange">字符</label>
          <div class="range-wrap">
            <input id="lenRange" type="range" min="8" max="100" value="16" aria-label="密码长度">
          </div>
          <input id="lenNum" type="number" inputmode="numeric" min="8" max="100" value="16" class="num-box mono" aria-label="密码长度数值">
        </div>
        <div class="opt-row">
          <label class="switch-item">
            <span class="switch-text">数字</span>
            <input id="optNumbers" type="checkbox" role="switch" checked>
            <span class="switch-track" aria-hidden="true"></span>
          </label>
          <label class="switch-item">
            <span class="switch-text">符号</span>
            <input id="optSymbols" type="checkbox" role="switch" checked>
            <span class="switch-track" aria-hidden="true"></span>
          </label>
        </div>
      </div>

      <div id="panel-memorable" data-panel="memorable" class="hidden">
        <div class="slider-row">
          <label class="ctrl-lbl" for="wordRange">单词</label>
          <div class="range-wrap">
            <input id="wordRange" type="range" min="3" max="15" value="4" aria-label="单词数量">
          </div>
          <input id="wordNum" type="number" inputmode="numeric" min="3" max="15" value="4" class="num-box mono" aria-label="单词数量数值">
        </div>
        <div class="opt-row">
          <label class="switch-item">
            <span class="switch-text">首字母大写</span>
            <input id="optCap" type="checkbox" role="switch" checked>
            <span class="switch-track" aria-hidden="true"></span>
          </label>
          <div class="sep-group">
            <span class="ctrl-lbl">分隔符</span>
            <div class="sep-pills" role="radiogroup" aria-label="单词分隔符">
              <button type="button" class="sep-pill active" role="radio" aria-checked="true" data-sep="-" title="连字符">-</button>
              <button type="button" class="sep-pill" role="radio" aria-checked="false" data-sep=" " title="空格">空格</button>
              <button type="button" class="sep-pill" role="radio" aria-checked="false" data-sep="." title="句点">.</button>
              <button type="button" class="sep-pill" role="radio" aria-checked="false" data-sep="_" title="下划线">_</button>
            </div>
          </div>
        </div>
      </div>

      <div id="panel-pin" data-panel="pin" class="hidden">
        <div class="slider-row">
          <label class="ctrl-lbl" for="pinRange">位数</label>
          <div class="range-wrap">
            <input id="pinRange" type="range" min="3" max="12" value="6" aria-label="PIN 位数">
          </div>
          <input id="pinNum" type="number" inputmode="numeric" min="3" max="12" value="6" class="num-box mono" aria-label="PIN 位数数值">
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <span class="sec-label">生成密码</span>
        <span id="strengthBadge" class="strength" data-level="very-strong" title="熵值估算">
          <span class="dot" aria-hidden="true"></span>
          <span id="strengthText">极强</span>
        </span>
      </div>
      <div id="pwOutput" class="pw-box" role="button" tabindex="0" aria-label="点击复制生成的密码" title="点击复制密码">
        <div id="pwText" class="pw-text" aria-live="polite"></div>
      </div>
      <div class="actions-row">
        <button type="button" id="copyBtn" class="btn btn-primary">
          <svg class="ic" aria-hidden="true"><use id="copyBtnIcon" href="#i-copy"/></svg>
          <span id="copyBtnText">复制密码</span>
        </button>
        <button type="button" id="refreshBtn" class="btn btn-secondary">
          <svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>
          <span>刷新密码</span>
        </button>
      </div>
    </div>

    <div class="card-foot">
      <svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg>
      <span>本地随机生成（CSPRNG），复制后自动云端同步历史（最多 50 条）。</span>
    </div>
    </div>

    <div id="historyView" class="hidden" aria-label="密码历史">
      <div class="hist-head">
        <div class="hist-head-left">
          <button type="button" id="historyBackBtn" class="hist-back" aria-label="返回密码生成器">
            <svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>
            <span>返回</span>
          </button>
          <span class="hist-title">密码历史</span>
          <span id="historyMeta" class="hist-meta"></span>
        </div>
        <button type="button" id="historyClearBtn" class="hist-clear" disabled>
          <svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg>
          <span id="historyClearText">清空</span>
        </button>
      </div>

      <div id="historyError" class="hist-banner hidden" role="alert">
        <span id="historyErrorText">同步失败，请稍后重试</span>
        <button type="button" id="historyRetryBtn" class="hist-retry">重试</button>
      </div>

      <div id="historyLoading" class="hist-state hidden">正在同步密码历史…</div>

      <div id="historyEmpty" class="hist-empty hidden">
        <svg class="ic" aria-hidden="true"><use href="#i-history"/></svg>
        <div class="hist-empty-title">暂无密码历史</div>
        <div class="hist-empty-sub">点击「复制密码」后会自动云端同步到这里，方便跨设备找回，最多保留 50 条。</div>
      </div>

      <ul id="historyList" class="hist-list" aria-label="密码历史列表"></ul>

      <div class="card-foot">
        <svg class="ic" aria-hidden="true"><use href="#i-history"/></svg>
        <span>跨设备云端同步，按复制时间从新到旧排列，最多保留 50 条。</span>
      </div>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/password-generator.js"></script>
</body>
</html>
